<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sotto un manto di stelle – Claudia Falanga</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060818;font-family:'Crimson Text',Georgia,serif}
.section{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .35s ease;
  overflow:hidden;background:transparent;z-index:20}
.section.active{opacity:1;pointer-events:all}
.section::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0}
.section>*{position:relative;z-index:1}
.nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;
  justify-content:space-between;padding:10px 18px;
  background:rgba(5,5,20,0.78);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.1)}
.nav-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);
  color:#fff;padding:6px 16px;border-radius:20px;cursor:pointer;
  font-family:'Crimson Text',serif;font-size:15px;transition:all .18s}
.nav-btn:hover{background:rgba(255,255,255,0.22);transform:scale(1.04)}
.nav-btn.disabled{opacity:0.25;pointer-events:none}
.nav-home{background:none;border:none;color:rgba(255,255,220,.8);
  font-family:'Dancing Script',cursive;font-size:17px;cursor:pointer;
  padding:4px 8px;border-radius:8px;transition:color .2s;
  white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.nav-home:hover{color:#fff}
#home{justify-content:center;align-items:center}
#sky-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.home-title{position:relative;z-index:10;text-align:center;margin-bottom:44px;pointer-events:none}
.home-title h1{font-family:'Dancing Script',cursive;font-size:clamp(26px,6vw,50px);
  color:rgba(255,255,240,.9);text-shadow:0 0 28px rgba(130,100,255,.6);line-height:1.25}
.home-title p{font-style:italic;font-size:16px;color:rgba(255,255,220,.45);margin-top:6px}
.stars-grid{position:relative;z-index:10;width:min(520px,94vw);height:min(420px,54vh)}
.star-btn{position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .18s}
.star-btn:hover{transform:translate(-50%,-50%) scale(1.28)}
.star-icon{font-size:clamp(20px,2.8vw,28px);line-height:1;
  filter:drop-shadow(0 0 7px currentColor);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.5}}
.star-label{font-family:'Dancing Script',cursive;font-size:clamp(10px,1.4vw,13px);
  color:rgba(255,255,220,.9);text-shadow:0 0 5px #000,0 0 10px #000;white-space:nowrap}
.slides-container{position:relative;width:min(720px,100vw);height:100%;overflow:hidden}
.slides-container::after{content:'';position:absolute;inset:-8%;pointer-events:none;opacity:0;z-index:2;
  background:
    linear-gradient(135deg,transparent 18%,rgba(255,255,255,.06) 32%,rgba(255,248,220,.42) 37%,rgba(180,220,255,.2) 41%,transparent 52%),
    radial-gradient(circle at 22% 28%,rgba(255,255,255,.95) 0 1.6px,transparent 4px),
    radial-gradient(circle at 76% 24%,rgba(255,245,210,.82) 0 2px,transparent 5px),
    radial-gradient(circle at 64% 70%,rgba(190,220,255,.72) 0 1.5px,transparent 4px),
    radial-gradient(circle at 36% 66%,rgba(255,255,255,.88) 0 1.7px,transparent 4.5px),
    radial-gradient(circle at center,rgba(255,255,255,.16),transparent 62%)}
.slides-container.transitioning::after{animation:star-sweep 1.45s cubic-bezier(.22,.7,.2,1)}
.slide-img{position:absolute;top:70px;left:50%;width:min(720px,calc(100vw - 24px));
  max-width:100%;max-height:calc(100vh - 90px);object-fit:contain;
  opacity:0;visibility:hidden;transform:translateX(-50%) scale(.965);
  transition:opacity .9s ease,transform 1.15s ease;filter:drop-shadow(0 18px 40px rgba(0,0,0,.25))}
.slide-img.active{opacity:1;visibility:visible;transform:translateX(-50%) scale(1);z-index:1}
@keyframes star-sweep{
  0%{opacity:0;transform:translate3d(-5%,-3%,0) scale(.94) rotate(-2deg)}
  18%{opacity:.24}
  45%{opacity:.72}
  100%{opacity:0;transform:translate3d(4%,3%,0) scale(1.08) rotate(1deg)}
}
.bg-italiano::before{background:linear-gradient(170deg,rgba(24,8,8,.74),rgba(38,15,15,.74))}
.bg-inglese::before{background:linear-gradient(170deg,rgba(8,12,24,.72),rgba(16,24,40,.72))}
.bg-arte::before{background:linear-gradient(170deg,rgba(20,8,24,.72),rgba(30,12,40,.72))}
.bg-scienze::before{background:linear-gradient(170deg,rgba(4,8,16,.7),rgba(6,14,30,.7))}
.bg-storia::before{background:linear-gradient(170deg,rgba(7,19,31,.72),rgba(15,30,53,.72))}
.bg-tecnologia::before{background:linear-gradient(170deg,rgba(6,12,20,.72),rgba(12,20,32,.72))}
.bg-geografia::before{background:linear-gradient(170deg,rgba(8,18,8,.7),rgba(12,32,16,.7))}
.bg-educivica::before{background:linear-gradient(170deg,rgba(14,20,8,.72),rgba(22,32,8,.72))}
.bg-scienzemot::before{background:linear-gradient(170deg,rgba(24,12,6,.72),rgba(34,20,8,.72))}
.bg-francese::before{background:linear-gradient(170deg,rgba(8,18,8,.7),rgba(16,32,24,.7))}
.bg-musica::before{background:linear-gradient(170deg,rgba(8,8,24,.72),rgba(16,10,48,.72))}
.bg-religione::before{background:linear-gradient(170deg,rgba(16,8,32,.72),rgba(30,16,69,.72))}
.bg-saluti::before{background:linear-gradient(170deg,rgba(18,10,32,.74),rgba(40,20,68,.74))}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:2px}
</style>
</head>

<script>
const SUBJECTS=[
  {id:'italiano',   label:'Italiano',        color:'#fca5a5', x:18, y:10},
  {id:'inglese',    label:'Inglese',          color:'#93c5fd', x:72, y:8},
  {id:'arte',       label:'Arte',             color:'#e879f9', x:40, y:18},
  {id:'scienze',    label:'Scienze',          color:'#818cf8', x:85, y:22},
  {id:'storia',     label:'Storia',           color:'#7dd4fc', x:12, y:32},
  {id:'tecnologia', label:'Tecnologia',       color:'#67e8f9', x:78, y:35},
  {id:'geografia',  label:'Geografia',        color:'#6ee7b7', x:50, y:42},
  {id:'educivica',  label:'Ed. Civica',       color:'#fde68a', x:20, y:55},
  {id:'scienzemot', label:'Scienze Motorie',  color:'#fb923c', x:82, y:58},
  {id:'francese',   label:'Francese',         color:'#86efac', x:38, y:67},
  {id:'musica',     label:'Musica',           color:'#a5b4fc', x:68, y:72},
  {id:'religione',  label:'Religione',        color:'#c4b5fd', x:15, y:78},
  {id:'saluti',     label:'Saluti finali',    color:'#f9a8d4', x:52, y:84},
];
const ORDER=['home',...Array.from(document.querySelectorAll('.section[id]:not(#home)')).map(section=>section.id)];
let current='home';
const sectionContainers=Object.fromEntries(
  SUBJECTS.map(s=>[s.id,document.querySelector(`#${s.id} .slides-container`)])
);
const sectionSlides=Object.fromEntries(
  SUBJECTS.map(s=>[s.id,Array.from(document.querySelectorAll(`#${s.id} .slide-img`))])
);
const sectionState=Object.fromEntries(
  SUBJECTS.map(s=>[s.id,0])
);

function setSlide(id,index,animate=false){
  const slides=sectionSlides[id]||[];
  if(!slides.length) return;
  const bounded=Math.max(0,Math.min(index,slides.length-1));
  const container=sectionContainers[id];
  if(animate&&container){
    container.classList.remove('transitioning');
    void container.offsetWidth;
    container.classList.add('transitioning');
  }
  sectionState[id]=bounded;
  slides.forEach((slide,i)=>slide.classList.toggle('active',i===bounded));
}
function showSection(id,slideIndex=null){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById(id);
  if(el){el.classList.add('active');}
  if(id!=='home'){
    const targetSlide=slideIndex===null?sectionState[id]:slideIndex;
    setSlide(id,targetSlide,current!=='home');
  }
  current=id; updateNav();
}
function updateNav(){
  const idx=ORDER.indexOf(current);
  const slideIdx=sectionState[current]||0;
  const slideCount=(sectionSlides[current]||[]).length;
  const atStart=current==='home'||(slideIdx===0&&idx<=1);
  const atEnd=current!=='home'&&slideIdx===slideCount-1&&idx>=ORDER.length-1;
  document.getElementById('btn-back').className='nav-btn'+(atStart?' disabled':'');
  document.getElementById('btn-next').className='nav-btn'+(atEnd?' disabled':'');
  const subj=SUBJECTS.find(s=>s.id===current);
  document.getElementById('nav-title').textContent=subj
    ?`✦ ${subj.label}${slideCount>1?` ${slideIdx+1}/${slideCount}`:''}`
    :'✦ Sotto un manto di stelle';
}
function navigate(dir){
  const idx=ORDER.indexOf(current);
  if(current==='home'){
    if(dir==='next'&&idx<ORDER.length-1) showSection(ORDER[idx+1],0);
    return;
  }
  const slides=sectionSlides[current]||[];
  const slideIdx=sectionState[current]||0;
  if(dir==='back'){
    if(slideIdx>0){ setSlide(current,slideIdx-1,true); updateNav(); return; }
    if(idx>0){
      const prevId=ORDER[idx-1];
      if(prevId==='home') showSection('home');
      else showSection(prevId,(sectionSlides[prevId]||[]).length-1);
    }
  }
  if(dir==='next'){
    if(slideIdx<slides.length-1){ setSlide(current,slideIdx+1,true); updateNav(); return; }
    if(idx<ORDER.length-1) showSection(ORDER[idx+1],0);
  }
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') navigate('next');
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') navigate('back');
});

const grid=document.getElementById('stars-grid');
const delays=[0,.4,.8,1.2,1.6,2,.2,1,1.4,.6,1.8,2.2];
SUBJECTS.forEach((s,i)=>{
  const btn=document.createElement('div');
  btn.className='star-btn';
  btn.style.left=s.x+'%'; btn.style.top=s.y+'%';
  btn.onclick=()=>showSection(s.id,0);
  btn.innerHTML=`<div class="star-icon" style="color:${s.color};animation-delay:${delays[i]||0}s">★</div><div class="star-label">${s.label}</div>`;
  grid.appendChild(btn);
});

const canvas=document.getElementById('sky-canvas');
const ctx=canvas.getContext('2d');
let stars=[];
function resize(){
  canvas.width=window.innerWidth; canvas.height=window.innerHeight; stars=[];
  for(let i=0;i<220;i++) stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.4+.3,a:Math.random(),da:(Math.random()-.5)*.005});
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{s.a+=s.da;if(s.a>1||s.a<.1)s.da*=-1;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,240,${s.a})`;ctx.fill();});
  requestAnimationFrame(draw);
}
window.addEventListener('resize',resize); resize(); draw();
Object.keys(sectionSlides).forEach(id=>setSlide(id,0));
updateNav();
</script>
